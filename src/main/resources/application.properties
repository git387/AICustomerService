# 基于Spring AI 2.0的带智能客服的商城系统
spring.application.name=AICustomerService
server.port=8080

# ==================== 数据源 MySQL 5.7 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/customer_service?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis-Plus ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== Redis 向量库 ====================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=knowledge-index
spring.ai.vectorstore.redis.prefix=knowledge:

# ==================== Spring AI / DashScope OpenAI 兼容接口 ====================
# 请将 api-key 替换为你的阿里云百炼 API Key，也可通过环境变量 DASHSCOPE_API_KEY 注入
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
spring.ai.openai.chat.model=qwen3.8-max
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.embedding.model=qwen3.7-text-embedding
spring.ai.openai.embedding.dimensions=2048

# ==================== 文件上传 ====================
app.upload.path=D:/workspace/uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ==================== Thymeleaf ====================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# 支付宝从外部站点跳回时，Lax Cookie 可随顶级 GET 带回
server.servlet.session.cookie.same-site=lax

# ==================== 支付宝沙箱（请填写你自己的沙箱密钥） ====================
alipay.app-id=9021000167600071
alipay.private-
alipay.public-
alipay.gateway-url=https://openapi-sandbox.dl.alipaydev.com/gateway.do
# 异步通知走公网（支付宝服务器回调）；同步回跳走本机，才能带上登录 Session 回到订单页
alipay.notify-url=https://portal-unnerve-strike.ngrok-free.dev/pay/notify
alipay.return-url=http://localhost:8080/pay/return
