<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<title>订单详情</title>
<div th:fragment="content" class="content">
    <div class="page-head">
        <h2>订单详情</h2>
        <a href="/orders">返回订单列表</a>
    </div>

    <div th:if="${order == null}" class="empty">订单不存在或无权查看</div>

    <div class="order-detail" th:if="${order != null}">
        <section class="card order-status-banner" th:classappend="' banner-' + ${order.status.code}">
            <div>
                <h3 th:text="${order.status.label}">状态</h3>
                <p class="muted" th:if="${order.status.canPay()}">请尽快完成支付，超时未付可能影响发货安排。</p>
                <p class="muted" th:if="${order.status.code == 'PAID'}">商家正在备货，发货后可在此查看进度。</p>
                <p class="muted" th:if="${order.status.code == 'SHIPPED'}">商品已发出，请注意查收。</p>
                <p class="muted" th:if="${order.status.code == 'COMPLETED'}">订单已完成，感谢您的购买。</p>
                <p class="muted" th:if="${order.status.code == 'CANCELLED'}">订单已取消。</p>
            </div>
            <div class="order-detail-amount">
                <span class="muted">订单金额</span>
                <span class="price" th:text="'¥' + ${order.totalAmount}">金额</span>
            </div>
        </section>

        <section class="card order-panel">
            <h3>订单信息</h3>
            <div class="order-info-grid">
                <div>
                    <span class="muted">订单号</span>
                    <p>
                        <strong th:text="${order.orderNo}">订单号</strong>
                        <button type="button" class="link-btn" th:onclick="|copyOrderNo('${order.orderNo}')|">复制</button>
                    </p>
                </div>
                <div>
                    <span class="muted">下单时间</span>
                    <p th:text="${order.createTime != null ? #strings.replace(order.createTime.toString(), 'T', ' ').substring(0, 19) : '-'}">时间</p>
                </div>
                <div th:if="${order.payTime != null}">
                    <span class="muted">支付时间</span>
                    <p th:text="${#strings.replace(order.payTime.toString(), 'T', ' ').substring(0, 19)}">支付时间</p>
                </div>
                <div th:if="${order.alipayTradeNo != null and !order.alipayTradeNo.isEmpty()}">
                    <span class="muted">支付宝交易号</span>
                    <p th:text="${order.alipayTradeNo}">交易号</p>
                </div>
            </div>
        </section>

        <section class="card order-panel">
            <h3>收货信息</h3>
            <p class="order-receiver">
                <strong th:text="${order.receiverName}">收货人</strong>
                <span th:text="${order.receiverPhone}">手机</span>
            </p>
            <p class="muted" th:text="${order.address}">地址</p>
        </section>

        <section class="card order-panel">
            <h3>商品明细</h3>
            <div class="order-item-rows">
                <div class="order-item-row" th:each="item : ${order.items}">
                    <a class="order-item-img" th:href="@{/product/{id}(id=${item.productId})}">
                        <img th:if="${item.productImage != null and !item.productImage.isEmpty()}"
                             th:src="${item.productImage}" th:alt="${item.productName}">
                        <div th:if="${item.productImage == null or item.productImage.isEmpty()}"
                             class="placeholder-img" th:text="${#strings.substring(item.productName,0,1)}">商</div>
                    </a>
                    <div>
                        <a th:href="@{/product/{id}(id=${item.productId})}">
                            <strong th:text="${item.productName}">商品</strong>
                        </a>
                        <p class="muted" th:text="'单价 ¥' + ${item.price}">单价</p>
                    </div>
                    <div class="order-item-right">
                        <span class="muted" th:text="'× ' + ${item.quantity}">数量</span>
                        <span class="price" th:text="'¥' + ${item.price}">小计展示单价</span>
                    </div>
                </div>
            </div>
            <div class="order-total-line">
                <span>共 <th:block th:text="${#lists.size(order.items)}">0</th:block> 种商品</span>
                <span>合计 <strong class="price" th:text="'¥' + ${order.totalAmount}">金额</strong></span>
            </div>
        </section>

        <div class="order-detail-actions" th:if="${order.status.canPay()}">
            <button class="btn btn-outline" th:onclick="|cancelOrder(${order.id})|">取消订单</button>
            <a class="btn" th:href="@{/pay/{no}(no=${order.orderNo})}">去支付</a>
        </div>
    </div>

    <script>
        window.copyOrderNo = function(no) {
            navigator.clipboard.writeText(no).then(() => toast('订单号已复制')).catch(() => toast(no));
        };
        window.cancelOrder = async function(id) {
            if (!confirm('确认取消该订单？取消后不可恢复。')) return;
            try {
                await api('/api/orders/' + id + '/cancel', { method: 'POST' });
                toast('订单已取消');
                setTimeout(() => location.href = '/orders', 500);
            } catch (e) {
                toast(e.message, { type: 'error' });
            }
        };
    </script>
</div>
</html>
