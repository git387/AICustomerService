<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<title th:text="${product.name} + ' - 商品详情'">商品详情</title>
<div th:fragment="content" class="content">
    <div class="detail">
        <div class="detail-img">
            <img th:if="${product.image != null and !product.image.isEmpty()}" th:src="${product.image}" th:alt="${product.name}">
            <div th:if="${product.image == null or product.image.isEmpty()}" class="placeholder-img" style="height:100%" th:text="${#strings.substring(product.name,0,1)}">商</div>
        </div>
        <div class="panel card">
            <p class="muted" th:text="${product.categoryName}">分类</p>
            <h1 th:text="${product.name}">商品名</h1>
            <p class="price" style="font-size:28px" th:text="'¥' + ${product.price}">¥0</p>
            <p th:text="${product.description}">简介</p>
            <p class="muted" th:text="'库存 ' + ${product.stock} + ' 件 · 付款后 1-3 天发货'">库存</p>
            <div class="qty-row">
                <label>数量</label>
                <input id="qty" class="qty" type="number" min="1" value="1">
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn" th:onclick="|addToCart(${product.id}, Number(document.getElementById('qty').value), this)|">加入购物车</button>
                <a class="btn btn-outline" href="/cart">去购物车</a>
            </div>
        </div>
    </div>
</div>
</html>
