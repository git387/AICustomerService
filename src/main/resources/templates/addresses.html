<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<title>收货地址</title>
<div th:fragment="content" class="content">
    <div class="page-head">
        <h2>收货地址</h2>
        <span class="muted">结算时可直接选用，建议设置一个默认地址</span>
    </div>
    <div class="page-split">
        <div id="address-list" class="address-list">加载中...</div>
        <form id="addr-form" class="form card panel form-wide" onsubmit="saveAddress(event)">
            <h3 id="form-title">新增地址</h3>
            <input type="hidden" name="id">
            <label>收货人</label>
            <input name="receiverName" required>
            <label>手机号</label>
            <input name="receiverPhone" required>
            <label>省 / 市 / 区</label>
            <div class="form-grid">
                <input name="province" placeholder="省">
                <input name="city" placeholder="市">
                <input name="district" placeholder="区/县">
            </div>
            <label>详细地址</label>
            <textarea name="detail" rows="2" required></textarea>
            <label style="display:flex;align-items:center;gap:6px">
                <input type="checkbox" name="isDefault" style="width:auto"> 设为默认地址
            </label>
            <div style="display:flex;gap:8px">
                <button class="btn" type="submit">保存</button>
                <button class="btn btn-outline" type="button" onclick="resetForm()">清空</button>
            </div>
        </form>
    </div>
    <script>
        let addresses = [];
        async function loadAddresses() {
            try {
                const res = await api('/api/addresses');
                addresses = res.data || [];
                renderList();
            } catch (e) {
                document.getElementById('address-list').textContent = e.message;
            }
        }
        function renderList() {
            const box = document.getElementById('address-list');
            if (!addresses.length) {
                box.innerHTML = '<div class="empty">还没有收货地址，请在右侧添加</div>';
                return;
            }
            box.innerHTML = addresses.map(a => `
                <div class="address-card">
                    <div class="row">
                        <strong>${a.receiverName} ${a.receiverPhone}</strong>
                        ${a.isDefault === 1 ? '<span class="tag-default">默认</span>' : ''}
                    </div>
                    <p class="muted">${(a.province||'')+(a.city||'')+(a.district||'')+(a.detail||'')}</p>
                    <p>
                        <button class="btn btn-outline btn-sm" onclick="editAddress(${a.id})">编辑</button>
                        ${a.isDefault === 1 ? '' : `<button class="btn btn-outline btn-sm" onclick="setDefault(${a.id})">默认</button>`}
                        <button class="btn btn-danger btn-sm" onclick="removeAddress(${a.id})">删除</button>
                    </p>
                </div>`).join('');
        }
        function resetForm() {
            const form = document.getElementById('addr-form');
            form.reset();
            form.id.value = '';
            document.getElementById('form-title').textContent = '新增地址';
        }
        window.editAddress = function(id) {
            const a = addresses.find(item => item.id === id);
            if (!a) return;
            const form = document.getElementById('addr-form');
            form.id.value = a.id;
            form.receiverName.value = a.receiverName || '';
            form.receiverPhone.value = a.receiverPhone || '';
            form.province.value = a.province || '';
            form.city.value = a.city || '';
            form.district.value = a.district || '';
            form.detail.value = a.detail || '';
            form.isDefault.checked = a.isDefault === 1;
            document.getElementById('form-title').textContent = '编辑地址';
        };
        window.setDefault = async function(id) {
            try {
                await api('/api/addresses/' + id + '/default', { method: 'PUT' });
                loadAddresses();
            } catch (e) {
                toast(e.message, { type: 'error' });
            }
        };
        window.removeAddress = async function(id) {
            if (!confirm('确认删除该地址？')) return;
            try {
                await api('/api/addresses/' + id, { method: 'DELETE' });
                loadAddresses();
                resetForm();
            } catch (e) {
                toast(e.message, { type: 'error' });
            }
        };
        window.saveAddress = async function(event) {
            event.preventDefault();
            const form = event.target;
            const payload = {
                receiverName: form.receiverName.value,
                receiverPhone: form.receiverPhone.value,
                province: form.province.value,
                city: form.city.value,
                district: form.district.value,
                detail: form.detail.value,
                isDefault: form.isDefault.checked ? 1 : 0
            };
            const id = form.id.value;
            try {
                if (id) {
                    await api('/api/addresses/' + id, { method: 'PUT', body: JSON.stringify(payload) });
                } else {
                    await api('/api/addresses', { method: 'POST', body: JSON.stringify(payload) });
                }
                toast('地址已保存');
                resetForm();
                loadAddresses();
            } catch (e) {
                toast(e.message, { type: 'error' });
            }
        };
        document.addEventListener('DOMContentLoaded', loadAddresses);
    </script>
</div>
</html>
